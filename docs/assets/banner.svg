<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Personal Chess Coach: a desktop reviewer for your own Chess.com games">
  <style>
    .bar { transform-origin: 0 240px; animation: bar 6s ease-in-out infinite; }
    .route { animation: route 2.6s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes bar { 0%,100% { transform: scaleY(.5); } 50% { transform: scaleY(.66); } }
    @keyframes route { to { stroke-dashoffset: -26; } }
    @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.6; } }
    /* Respect the system "reduce motion" setting. */
    @media (prefers-reduced-motion: reduce) { .bar, .route, .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1210"/><stop offset="0.6" stop-color="#141a17"/><stop offset="1" stop-color="#18201b"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b45a"/><stop offset="1" stop-color="#d9b45a" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeIn" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="bm"><rect width="1000" height="300" fill="url(#fadeIn)"/></mask>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
