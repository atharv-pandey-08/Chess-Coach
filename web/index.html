<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Coach</title>
  <link rel="icon" href="/pieces/wn.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Home"><img src="/pieces/wn.png" alt="" />Chess Coach</a>

    <form id="user-form" class="user-form" autocomplete="off">
      <input id="user-input" name="username" placeholder="Chess.com username" spellcheck="false" aria-label="Chess.com username" />
      <button type="submit" class="btn btn-sm">Load</button>
    </form>

    <nav class="topbar-actions">
      <button id="import-btn" class="btn btn-quiet btn-sm">Import PGN</button>
      <details class="menu" id="settings">
        <summary class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </summary>
        <div class="menu-panel">
          <div class="menu-row"><span>Theme</span>
            <div class="seg" id="theme-seg"><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
          <div class="menu-row"><span>Board</span><div class="swatches" id="board-themes"></div></div>
          <label class="menu-row"><span>Move sounds</span><input type="checkbox" id="opt-sound" /></label>
          <label class="menu-row"><span>Engine arrows</span><input type="checkbox" id="opt-arrows" /></label>
          <p class="menu-note" id="engine-note"></p>
        </div>
      </details>
    </nav>
  </header>

  <div id="engine-banner" class="banner" hidden>
    Stockfish isn't installed, so games can't be analyzed. On macOS run <code>brew install stockfish</code> and restart the app.
  </div>

  <main id="app">
    <!-- HOME -->
    <section id="home-view" class="view home">
      <section id="profile" class="profile"></section>

      <div class="list-head">
        <h1>Games</h1>
        <div class="filters">
          <div class="seg" id="tc-filter">
            <button data-v="all" class="on">All</button>
            <button data-v="bullet">Bullet</button>
            <button data-v="blitz">Blitz</button>
            <button data-v="rapid">Rapid</button>
            <button data-v="daily">Daily</button>
          </div>
          <div class="seg" id="res-filter">
            <button data-v="all" class="on">Any</button>
            <button data-v="Win">Won</button>
            <button data-v="Loss">Lost</button>
            <button data-v="Draw">Drawn</button>
          </div>
          <input id="opp-search" class="search" placeholder="Search opponent or opening" aria-label="Search games" />
        </div>
      </div>
      <p id="games-sub" class="muted small">Loading…</p>
      <div id="games-list" class="games"></div>
    </section>

    <!-- REVIEW -->
    <section id="review-view" class="view review" hidden>
      <div class="board-col">
        <div class="player-bar" id="bar-top"></div>
        <div class="board-wrap">
          <div class="evalbar" id="evalbar">
            <div class="evalbar-fill" id="evalbar-fill"></div>
          </div>
          <div class="board" id="board">
            <div class="squares" id="squares"></div>
            <div class="pieces" id="pieces"></div>
            <svg class="arrows" id="arrows" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
          </div>
        </div>
        <div class="player-bar" id="bar-bottom"></div>

        <div class="under-board">
          <div class="controls">
            <button class="ctl" data-act="first" title="First move (↑)"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
            <button class="ctl" data-act="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
            <button class="ctl" data-act="play" title="Auto-play (Space)"><svg viewBox="0 0 24 24" class="fill"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="ctl" data-act="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
            <button class="ctl" data-act="last" title="Last move (↓)"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
            <span class="ctl-gap"></span>
            <button class="ctl" data-act="flip" title="Flip board (F)"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg></button>
          </div>
          <div class="graph-wrap">
            <svg id="graph" class="graph" preserveAspectRatio="none"></svg>
            <div class="graph-tip" id="graph-tip" hidden></div>
          </div>
        </div>
      </div>

      <aside class="side-col">
        <header class="game-head" id="game-head"></header>
        <div class="progress" id="progress" hidden>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-text"><span id="progress-text">Analyzing…</span><span id="progress-pct"></span></div>
        </div>
        <section class="coach" id="coach-card" aria-live="polite"></section>
        <div class="moves-wrap"><ol class="moves" id="moves"></ol></div>
      </aside>
    </section>
  </main>

  <dialog id="import-dialog" class="modal">
    <form method="dialog" id="import-form">
      <h2>Analyze any game</h2>
      <p class="muted">Paste a PGN from Chess.com, Lichess, or any chess app.</p>
      <textarea id="pgn-input" rows="10" placeholder='[Event "Casual game"]&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 ...'></textarea>
      <p id="import-error" class="err" hidden></p>
      <div class="modal-actions">
        <button value="cancel" class="btn btn-quiet" formnovalidate>Cancel</button>
        <button id="import-go" value="go" class="btn">Analyze game</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
