<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Coach</title>
  <link rel="icon" href="/pieces/wn.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-mark"><img src="/pieces/wn.png" alt="" /></span>
      <span class="brand-text">Chess<b>Coach</b></span>
    </a>

    <form id="user-form" class="user-form" autocomplete="off">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="user-input" name="username" placeholder="Chess.com username" spellcheck="false" />
      <button type="submit" class="btn btn-primary btn-sm">Load</button>
    </form>

    <div class="topbar-actions">
      <span id="engine-pill" class="pill" title="Stockfish status"><i></i><span>Engine</span></span>
      <button id="import-btn" class="btn btn-ghost btn-sm" title="Analyze a PGN">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="hide-sm">Import PGN</span>
      </button>
      <button id="sound-btn" class="icon-btn" title="Toggle move sounds (M)"></button>
      <button id="theme-btn" class="icon-btn" title="Toggle light / dark"></button>
    </div>
  </header>

  <main id="app">
    <!-- HOME -->
    <section id="home-view" class="view">
      <div class="home-grid">
        <aside class="profile-col">
          <div id="profile-card" class="card profile-card"></div>
          <div id="stats-card" class="card stats-card"></div>
        </aside>

        <section class="games-col">
          <div class="games-head">
            <div>
              <h1>Recent games</h1>
              <p id="games-sub" class="muted">Loading…</p>
            </div>
            <div class="filters">
              <div class="seg" id="tc-filter">
                <button data-v="all" class="on">All</button>
                <button data-v="bullet">Bullet</button>
                <button data-v="blitz">Blitz</button>
                <button data-v="rapid">Rapid</button>
                <button data-v="daily">Daily</button>
              </div>
              <div class="seg" id="res-filter">
                <button data-v="all" class="on">Any</button>
                <button data-v="Win">Wins</button>
                <button data-v="Loss">Losses</button>
                <button data-v="Draw">Draws</button>
              </div>
              <label class="search">
                <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="opp-search" placeholder="Opponent or opening" />
              </label>
            </div>
          </div>
          <div id="games-list" class="games-list"></div>
        </section>
      </div>
    </section>

    <!-- REVIEW -->
    <section id="review-view" class="view" hidden>
      <div class="review-grid">
        <div class="board-col">
          <div class="player-bar" id="bar-top"></div>
          <div class="board-wrap">
            <div class="evalbar" id="evalbar">
              <div class="evalbar-fill" id="evalbar-fill"></div>
              <span class="evalbar-label" id="evalbar-label"></span>
            </div>
            <div class="board" id="board">
              <div class="squares" id="squares"></div>
              <div class="pieces" id="pieces"></div>
              <svg class="arrows" id="arrows" viewBox="0 0 8 8" preserveAspectRatio="none"></svg>
            </div>
          </div>
          <div class="player-bar" id="bar-bottom"></div>

          <div class="controls">
            <button class="ctl" data-act="first" title="First move (↑)"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
            <button class="ctl" data-act="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
            <button class="ctl ctl-play" data-act="play" title="Auto-play (Space)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="ctl" data-act="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
            <button class="ctl" data-act="last" title="Last move (↓)"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
            <span class="ctl-sep"></span>
            <button class="ctl" data-act="flip" title="Flip board (F)"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg></button>
            <button class="ctl" data-act="arrows" title="Engine arrows (E)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5m0 0h-8m8 0v8"/></svg></button>
            <div class="theme-picker" id="board-themes" title="Board theme"></div>
          </div>
        </div>

        <aside class="side-col">
          <div class="card game-head" id="game-head"></div>

          <div class="progress card" id="progress" hidden>
            <div class="progress-top"><span id="progress-text">Analyzing…</span><span id="progress-pct" class="mono"></span></div>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          </div>

          <div class="tabs" role="tablist">
            <button class="tab on" data-tab="analysis">Analysis</button>
            <button class="tab" data-tab="report">Game report</button>
          </div>

          <div class="tab-panel" id="tab-analysis">
            <div class="card coach-card" id="coach-card"></div>
            <div class="card graph-card">
              <svg id="graph" class="graph" preserveAspectRatio="none"></svg>
              <div class="graph-tip" id="graph-tip" hidden></div>
            </div>
            <div class="card moves-card"><ol class="moves" id="moves"></ol></div>
          </div>

          <div class="tab-panel" id="tab-report" hidden>
            <div class="card" id="report"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <dialog id="import-dialog" class="modal">
    <form method="dialog" id="import-form">
      <h2>Analyze any game</h2>
      <p class="muted">Paste a PGN from Chess.com, Lichess, or any chess app.</p>
      <textarea id="pgn-input" rows="10" placeholder='[Event "Casual game"]&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 ...'></textarea>
      <p id="import-error" class="err" hidden></p>
      <div class="modal-actions">
        <button value="cancel" class="btn btn-ghost" formnovalidate>Cancel</button>
        <button id="import-go" value="go" class="btn btn-primary">Analyze game</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
